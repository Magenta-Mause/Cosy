apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cosy-letsencrypt
  labels:
    app.kubernetes.io/managed-by: cosy
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: EMAIL_PLACEHOLDER
    privateKeySecretRef:
      name: cosy-letsencrypt-key
    solvers:
      - http01:
          ingress: {}
